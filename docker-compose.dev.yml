services:
  pulseflow-collab-dev:
    image: node:22-alpine
    container_name: pulseflow-collab-dev
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3001:3000"
    env_file:
      - path: .env.development
        required: false
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseflow-collab"
version = "1.0.0"
description = "Real-Time Collaborative Incident Command & Operational Sync Engine with OCC & Multi-Node Pub/Sub Backplane"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Daniel" }
]
dependencies = [
    "aiohttp>=3.9.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

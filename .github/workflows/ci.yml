name: PulseFlow Collab CI

on:
  push:
    branches: ["dev", "main", "feat/**", "fix/**", "sdd/**"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  verify:
    name: Domain, OCC Persistence & API Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify zero external dependencies in src/domain
        run: |
          python -c "import src.domain; print('Domain layer imported cleanly')"

      - name: Run full unit & integration test suite
        run: |
          python -m unittest discover -s tests -v

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseFlow — Tablero Colaborativo en Tiempo Real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg-obsidian: #090d16;
        --bg-column: #111827;
        --bg-card: #172033;
        --bg-card-hover: #1c273d;
        --text-snow: #f8fafc;
        --text-slate: #94a3b8;
        --border-slate: #1e293b;
        --accent-emerald: #10b981;
        --accent-emerald-hover: #059669;
        --accent-amber: #f59e0b;
        --amber-tint: rgba(245, 158, 11, 0.14);
        --emerald-tint: rgba(16, 185, 129, 0.14);
        --danger-rose: #f43f5e;
        --font-display: "Sora", system-ui, sans-serif;
        --font-sans: "Manrope", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-obsidian);
        color: var(--text-snow);
        font-family: var(--font-sans);
        line-height: 1.5;
        min-height: 100dvh;
      }
      ::selection { background: var(--emerald-tint); color: var(--accent-emerald); }
      :focus-visible { outline: 2px solid var(--accent-emerald); outline-offset: 2px; }
      button, input, textarea, select { font-family: inherit; }

      .pf-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(9, 13, 22, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-slate);
      }
      .pf-header-inner {
        max-width: 1320px;
        margin: 0 auto;
        padding: 12px 22px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .pf-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .pf-brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--accent-emerald);
        color: #052e16;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 16px;
      }
      .pf-brand h1 {
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .pf-brand-sub {
        font-size: 13px;
        color: var(--text-slate);
      }

      .pf-presence-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .pf-avatar-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 9999px;
        background: var(--bg-column);
        border: 1px solid var(--border-slate);
        font-size: 12.5px;
        color: var(--text-snow);
      }
      .pf-dot-live {
        width: 7px;
        height: 7px;
        border-radius: 9999px;
        background: var(--accent-emerald);
      }

      .pf-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .pf-btn-primary {
        border: 1px solid var(--accent-emerald);
        background: var(--accent-emerald);
        color: #042f2e;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
      }
      .pf-btn-primary:hover { background: var(--accent-emerald-hover); color: #ffffff; }
      .pf-btn-amber {
        border: 1px solid rgba(245, 158, 11, 0.45);
        background: var(--amber-tint);
        color: #fcd34d;
        border-radius: 8px;
        padding: 8px 13px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .pf-btn-amber:hover { background: rgba(245, 158, 11, 0.24); }
      .pf-btn-ghost {
        border: 1px solid var(--border-slate);
        background: var(--bg-column);
        color: var(--text-snow);
        border-radius: 8px;
        padding: 8px 13px;
        font-size: 13.5px;
        font-weight: 500;
        cursor: pointer;
      }
      .pf-btn-ghost:hover { background: var(--bg-card); }

      .pf-main {
        max-width: 1320px;
        margin: 0 auto;
        padding: 22px 22px 54px;
      }
      .pf-conflict-banner {
        margin-bottom: 18px;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid rgba(245, 158, 11, 0.55);
        background: var(--amber-tint);
        display: none;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .pf-conflict-banner[data-visible="true"] { display: flex; }

      .pf-board {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        align-items: start;
      }
      .pf-col {
        background: var(--bg-column);
        border: 1px solid var(--border-slate);
        border-radius: 14px;
        padding: 16px;
        min-height: 460px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .pf-col-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-slate);
      }
      .pf-col-head h2 {
        font-family: var(--font-display);
        font-size: 15.5px;
        margin: 0;
      }
      .pf-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
      .pf-col-count {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-slate);
        background: var(--bg-obsidian);
        padding: 2px 8px;
        border-radius: 9999px;
      }

      .pf-card {
        background: var(--bg-card);
        border: 1px solid var(--border-slate);
        border-radius: 11px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: border-color 150ms ease, background-color 150ms ease;
      }
      .pf-card:hover { background: var(--bg-card-hover); border-color: #334155; }
      .pf-card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .pf-priority-badge {
        font-size: 11.5px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 6px;
      }
      .pf-priority-high { background: rgba(244, 63, 94, 0.16); color: #fda4af; }
      .pf-priority-med { background: var(--amber-tint); color: #fcd34d; }
      .pf-priority-norm { background: var(--emerald-tint); color: #6ee7b7; }
      .pf-card-title {
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        color: var(--text-snow);
      }
      .pf-card-summary {
        margin: 0;
        font-size: 13px;
        color: var(--text-slate);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .pf-card-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border-slate);
        font-size: 12px;
        color: var(--text-slate);
      }
      .pf-mini-btn {
        border: 1px solid var(--border-slate);
        background: var(--bg-obsidian);
        color: var(--text-snow);
        border-radius: 6px;
        padding: 4px 9px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .pf-mini-btn:hover { border-color: var(--accent-emerald); color: var(--accent-emerald); }

      /* Drawer / Modal */
      .pf-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.65);
        z-index: 40;
        display: none;
        justify-content: flex-end;
      }
      .pf-backdrop[data-open="true"] { display: flex; }
      .pf-drawer {
        width: min(460px, 100vw);
        height: 100%;
        background: var(--bg-column);
        border-left: 1px solid var(--border-slate);
        display: flex;
        flex-direction: column;
      }
      .pf-drawer-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-slate);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .pf-drawer-head h2 { font-family: var(--font-display); font-size: 18px; margin: 0; }
      .pf-drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .pf-input {
        width: 100%;
        background: var(--bg-obsidian);
        border: 1px solid var(--border-slate);
        border-radius: 8px;
        padding: 9px 11px;
        color: var(--text-snow);
        font-size: 13.5px;
      }
      .pf-box {
        background: var(--bg-obsidian);
        border: 1px solid var(--border-slate);
        border-radius: 10px;
        padding: 12px;
        font-size: 12.5px;
      }
      .pf-toast {
        position: fixed;
        bottom: 18px;
        right: 18px;
        z-index: 50;
        background: var(--bg-card);
        border: 1px solid var(--accent-emerald);
        color: var(--text-snow);
        padding: 10px 14px;
        border-radius: 9px;
        font-size: 13px;
        display: none;
      }
      .pf-toast[data-visible="true"] { display: block; }

      @media (max-width: 900px) {
        .pf-board { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="pf-header">
      <div class="pf-header-inner">
        <div class="pf-brand">
          <span class="pf-brand-mark">P</span>
          <div>
            <h1>PulseFlow</h1>
            <span class="pf-brand-sub">Tablero colaborativo en vivo sin sobrescrituras</span>
          </div>
        </div>

        <div class="pf-presence-row" id="pf-presence-bar" aria-label="Compañeros conectados"></div>

        <div class="pf-actions">
          <button type="button" class="pf-btn-amber" id="pf-sim-conflict-btn">Simular edición simultánea</button>
          <button type="button" class="pf-btn-primary" id="pf-new-task-btn">+ Nueva tarea</button>
          <button type="button" class="pf-btn-ghost" id="pf-arch-btn">Arquitectura</button>
        </div>
      </div>
    </header>

    <main class="pf-main">
      <div class="pf-conflict-banner" id="pf-conflict-banner" role="alert">
        <div>
          <strong style="color:#fcd34d;display:block;">Un compañero acaba de actualizar esta tarjeta</strong>
          <span id="pf-conflict-detail" style="font-size:13px;color:var(--text-snow);"></span>
        </div>
        <button type="button" class="pf-btn-primary" id="pf-reload-latest-btn">Cargar última versión</button>
      </div>

      <section class="pf-board" aria-label="Columnas de tareas del equipo">
        <div class="pf-col">
          <div class="pf-col-head">
            <h2>Por hacer</h2>
            <span class="pf-col-count" id="pf-count-open">0</span>
          </div>
          <div id="pf-list-open" style="display:flex;flex-direction:column;gap:12px;"></div>
        </div>

        <div class="pf-col">
          <div class="pf-col-head">
            <h2>En progreso</h2>
            <span class="pf-col-count" id="pf-count-prog">0</span>
          </div>
          <div id="pf-list-prog" style="display:flex;flex-direction:column;gap:12px;"></div>
        </div>

        <div class="pf-col">
          <div class="pf-col-head">
            <h2>Resuelto</h2>
            <span class="pf-col-count" id="pf-count-done">0</span>
          </div>
          <div id="pf-list-done" style="display:flex;flex-direction:column;gap:12px;"></div>
        </div>
      </section>
    </main>

    <!-- Task Detail Drawer -->
    <div class="pf-backdrop" id="pf-task-backdrop" data-open="false" role="dialog" aria-modal="true">
      <div class="pf-drawer">
        <div class="pf-drawer-head">
          <h2 id="pf-task-drawer-title">Detalle de tarea</h2>
          <button type="button" class="pf-btn-ghost" id="pf-task-close">Cerrar</button>
        </div>
        <div class="pf-drawer-body" id="pf-task-body"></div>
      </div>
    </div>

    <!-- New Task Drawer -->
    <div class="pf-backdrop" id="pf-new-backdrop" data-open="false" role="dialog" aria-modal="true">
      <div class="pf-drawer">
        <div class="pf-drawer-head">
          <h2>Nueva tarea del equipo</h2>
          <button type="button" class="pf-btn-ghost" id="pf-new-close">Cerrar</button>
        </div>
        <div class="pf-drawer-body" id="pf-new-body"></div>
      </div>
    </div>

    <!-- Layer 2 Architecture Drawer -->
    <div class="pf-backdrop" id="pf-arch-backdrop" data-open="false" role="dialog" aria-modal="true">
      <div class="pf-drawer">
        <div class="pf-drawer-head">
          <h2>Arquitectura Realtime &amp; OCC</h2>
          <button type="button" class="pf-btn-ghost" id="pf-arch-close">Cerrar</button>
        </div>
        <div class="pf-drawer-body" id="pf-arch-body"></div>
      </div>
    </div>

    <div class="pf-toast" id="pf-toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        const state = {
          tasks: [],
          presence: [],
          events: [],
          audit: [],
          activeTask: null,
        };

        const els = {
          presence: document.getElementById("pf-presence-bar"),
          openList: document.getElementById("pf-list-open"),
          progList: document.getElementById("pf-list-prog"),
          doneList: document.getElementById("pf-list-done"),
          openCount: document.getElementById("pf-count-open"),
          progCount: document.getElementById("pf-count-prog"),
          doneCount: document.getElementById("pf-count-done"),
          conflictBanner: document.getElementById("pf-conflict-banner"),
          conflictDetail: document.getElementById("pf-conflict-detail"),
          taskBackdrop: document.getElementById("pf-task-backdrop"),
          taskTitle: document.getElementById("pf-task-drawer-title"),
          taskBody: document.getElementById("pf-task-body"),
          newBackdrop: document.getElementById("pf-new-backdrop"),
          newBody: document.getElementById("pf-new-body"),
          archBackdrop: document.getElementById("pf-arch-backdrop"),
          archBody: document.getElementById("pf-arch-body"),
          toast: document.getElementById("pf-toast"),
        };

        function el(tag, props, children) {
          const node = document.createElement(tag);
          if (props) {
            for (const [k, v] of Object.entries(props)) {
              if (k === "className") node.className = v;
              else if (k === "textContent") node.textContent = v;
              else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
              else node.setAttribute(k, String(v));
            }
          }
          if (Array.isArray(children)) {
            for (const c of children) {
              if (typeof c === "string") node.appendChild(document.createTextNode(c));
              else if (c) node.appendChild(c);
            }
          }
          return node;
        }

        let toastTimer = null;
        function showToast(msg) {
          els.toast.textContent = msg;
          els.toast.setAttribute("data-visible", "true");
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { els.toast.setAttribute("data-visible", "false"); }, 3500);
        }

        function priorityBadge(sev) {
          if (sev === "SEV1") return { label: "Alta", cls: "pf-priority-badge pf-priority-high" };
          if (sev === "SEV2") return { label: "Media", cls: "pf-priority-badge pf-priority-med" };
          return { label: "Normal", cls: "pf-priority-badge pf-priority-norm" };
        }

        async function loadAll() {
          const [incRes, presRes] = await Promise.all([
            fetch("/api/v1/incidents"),
            fetch("/api/v1/presence"),
          ]);
          const incData = await incRes.json();
          const presData = await presRes.json();
          state.tasks = incData.incidents || [];
          state.presence = presData.presence || [];
          renderPresence();
          renderBoard();
        }

        async function loadArchitectureTelemetry() {
          const [evRes, audRes] = await Promise.all([
            fetch("/api/v1/events/backplane"),
            fetch("/api/v1/audit/ledger"),
          ]);
          const evData = await evRes.json();
          const audData = await audRes.json();
          state.events = evData.events || [];
          state.audit = audData.audit_entries || audData.entries || [];
          renderArchitecture();
        }

        function renderPresence() {
          const pills = state.presence.slice(0, 4).map(function (p) {
            return el("span", { className: "pf-avatar-pill" }, [
              el("span", { className: "pf-dot-live" }),
              el("span", { textContent: p.operator_id }),
            ]);
          });
          if (pills.length === 0) {
            pills.push(el("span", { className: "pf-avatar-pill" }, [el("span", { className: "pf-dot-live" }), el("span", { textContent: "Equipo conectado" })]));
          }
          els.presence.replaceChildren.apply(els.presence, pills);
        }

        async function moveTask(task, targetStatus) {
          const resp = await fetch("/api/v1/incidents/" + encodeURIComponent(task.incident_id), {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              expected_version: task.version,
              status: targetStatus,
              actor: "tú (tablero)",
              gateway_node: "ws-gateway-01",
            }),
          });
          const data = await resp.json();
          if (resp.status === 409) {
            els.conflictDetail.textContent =
              "Tu navegador tenía versión " + data.expected_version + ", pero el tablero ya avanzó a versión " + data.actual_version + ".";
            els.conflictBanner.setAttribute("data-visible", "true");
            return;
          }
          if (!resp.ok) {
            showToast(data.message || "No se pudo mover la tarjeta.");
            return;
          }
          els.conflictBanner.setAttribute("data-visible", "false");
          showToast("Tarjeta movida y sincronizada con el equipo.");
          await loadAll();
        }

        function buildTaskCard(task) {
          const p = priorityBadge(task.severity);
          const nextAction =
            task.status === "OPEN"
              ? { label: "Iniciar", target: "INVESTIGATING" }
              : task.status === "RESOLVED"
                ? { label: "Reabrir", target: "INVESTIGATING" }
                : { label: "Completar", target: "RESOLVED" };

          return el("article", { className: "pf-card" }, [
            el("div", { className: "pf-card-top" }, [
              el("span", { className: p.cls, textContent: p.label }),
              el("span", { className: "pf-mono", style: "font-size:11.5px;color:var(--text-slate);", textContent: "v" + task.version }),
            ]),
            el("h3", { className: "pf-card-title", textContent: task.title }),
            el("p", { className: "pf-card-summary", textContent: task.summary }),
            el("div", { className: "pf-card-foot" }, [
              el("span", { textContent: task.commander || "Equipo" }),
              el("div", { style: "display:flex;gap:6px;" }, [
                el("button", { type: "button", className: "pf-mini-btn", textContent: "Abrir", onClick: function () { openTaskDrawer(task); } }),
                el("button", { type: "button", className: "pf-mini-btn", textContent: nextAction.label, onClick: function () { moveTask(task, nextAction.target); } }),
              ]),
            ]),
          ]);
        }

        function renderBoard() {
          const open = state.tasks.filter(function (t) { return t.status === "OPEN"; });
          const prog = state.tasks.filter(function (t) { return t.status === "INVESTIGATING" || t.status === "MITIGATING"; });
          const done = state.tasks.filter(function (t) { return t.status === "RESOLVED"; });

          els.openCount.textContent = String(open.length);
          els.progCount.textContent = String(prog.length);
          els.doneCount.textContent = String(done.length);

          els.openList.replaceChildren.apply(els.openList, open.map(buildTaskCard));
          els.progList.replaceChildren.apply(els.progList, prog.map(buildTaskCard));
          els.doneList.replaceChildren.apply(els.doneList, done.map(buildTaskCard));
        }

        function openTaskDrawer(task) {
          state.activeTask = task;
          els.taskTitle.textContent = task.title;
          const titleIn = el("input", { className: "pf-input", value: task.title });
          const summaryIn = el("textarea", { className: "pf-input", style: "min-height:90px;", textContent: task.summary });
          summaryIn.value = task.summary;
          const commentIn = el("input", { className: "pf-input", placeholder: "Escribe una nota para el equipo..." });

          const saveBtn = el("button", {
            type: "button",
            className: "pf-btn-primary",
            textContent: "Guardar cambios",
            onClick: async function () {
              const resp = await fetch("/api/v1/incidents/" + encodeURIComponent(task.incident_id), {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  expected_version: task.version,
                  title: titleIn.value,
                  summary: summaryIn.value,
                  actor: "tú (editor)",
                }),
              });
              const data = await resp.json();
              if (resp.status === 409) {
                els.conflictDetail.textContent = "Conflicto detectado: tu copia (v" + data.expected_version + ") quedó atrás de v" + data.actual_version + ".";
                els.conflictBanner.setAttribute("data-visible", "true");
                els.taskBackdrop.setAttribute("data-open", "false");
                return;
              }
              if (resp.ok) {
                showToast("Tarea guardada en versión v" + data.incident.version + ".");
                els.taskBackdrop.setAttribute("data-open", "false");
                await loadAll();
              } else {
                showToast(data.message || "Error al guardar.");
              }
            },
          });

          const commentBtn = el("button", {
            type: "button",
            className: "pf-btn-ghost",
            textContent: "Publicar nota",
            onClick: async function () {
              if (!commentIn.value.trim()) return;
              const resp = await fetch("/api/v1/incidents/" + encodeURIComponent(task.incident_id) + "/comments", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ author: "tú", body: commentIn.value.trim() }),
              });
              if (resp.ok) {
                commentIn.value = "";
                showToast("Nota publicada en el hilo colaborativo.");
              }
            },
          });

          els.taskBody.replaceChildren(
            el("span", { className: "pf-mono", style: "font-size:12px;color:var(--text-slate);", textContent: task.incident_id + " · versión actual v" + task.version }),
            el("label", { style: "font-size:12.5px;color:var(--text-slate);", textContent: "Título" }),
            titleIn,
            el("label", { style: "font-size:12.5px;color:var(--text-slate);", textContent: "Descripción" }),
            summaryIn,
            saveBtn,
            el("div", { style: "border-top:1px solid var(--border-slate);padding-top:14px;display:flex;flex-direction:column;gap:8px;" }, [
              el("label", { style: "font-size:12.5px;color:var(--text-slate);", textContent: "Agregar comentario rápido" }),
              commentIn,
              commentBtn,
            ]),
          );
          els.taskBackdrop.setAttribute("data-open", "true");
        }

        function openNewTaskDrawer() {
          const titleIn = el("input", { className: "pf-input", placeholder: "Ej. Revisar pantalla de bienvenida" });
          const summaryIn = el("textarea", { className: "pf-input", style: "min-height:84px;", placeholder: "Contexto breve para tu equipo..." });
          const sevSel = el("select", { className: "pf-input" }, [
            el("option", { value: "SEV2", textContent: "Prioridad Media" }),
            el("option", { value: "SEV1", textContent: "Prioridad Alta" }),
            el("option", { value: "SEV3", textContent: "Prioridad Normal" }),
          ]);
          const createBtn = el("button", {
            type: "button",
            className: "pf-btn-primary",
            textContent: "Crear tarjeta en tablero",
            onClick: async function () {
              const resp = await fetch("/api/v1/incidents", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  title: titleIn.value.trim() || "Nueva coordinación de equipo",
                  service_name: "team-workspace",
                  severity: sevSel.value,
                  commander: "daniel.team",
                  summary: summaryIn.value.trim() || "Tarea creada desde el tablero colaborativo en vivo.",
                }),
              });
              const data = await resp.json();
              if (resp.ok) {
                els.newBackdrop.setAttribute("data-open", "false");
                showToast("Tarjeta creada y emitida a todo el equipo.");
                await loadAll();
              } else {
                showToast(data.message || "Revisa los campos de la tarea.");
              }
            },
          });

          els.newBody.replaceChildren(
            el("label", { style: "font-size:12.5px;color:var(--text-slate);", textContent: "Título de la tarea" }),
            titleIn,
            el("label", { style: "font-size:12.5px;color:var(--text-slate);", textContent: "Prioridad" }),
            sevSel,
            el("label", { style: "font-size:12.5px;color:var(--text-slate);", textContent: "Notas iniciales" }),
            summaryIn,
            createBtn,
          );
          els.newBackdrop.setAttribute("data-open", "true");
        }

        function renderArchitecture() {
          const evNodes = state.events.slice(0, 6).map(function (ev) {
            return el("div", { className: "pf-box" }, [
              el("div", { className: "pf-mono", style: "color:var(--accent-emerald);", textContent: ev.event_type + " · " + ev.origin_node }),
              el("div", { style: "color:var(--text-slate);margin-top:4px;", textContent: (ev.incident_id || "") + " v" + (ev.version || 1) + " · " + (ev.actor || "") }),
            ]);
          });
          els.archBody.replaceChildren.apply(
            els.archBody,
            [
              el("div", { className: "pf-box", style: "border-color:rgba(16,185,129,0.4);" }, [
                el("strong", { style: "display:block;margin-bottom:4px;", textContent: "Monolito Modular + Bloqueo Optimista CAS (HTTP 409)" }),
                el("span", { style: "color:var(--text-slate);", textContent: "Cada edición exige expected_version para impedir que dos operadores sobreescriban trabajo ajeno, y replica el evento por Pub/Sub multi-nodo." }),
              ]),
              el("h3", { style: "font-family:var(--font-display);font-size:14px;margin:4px 0;", textContent: "Últimos eventos Pub/Sub multi-nodo" }),
            ].concat(evNodes.length > 0 ? evNodes : [el("div", { className: "pf-box", textContent: "Mueve una tarjeta para ver eventos en vivo." })]),
          );
        }

        document.getElementById("pf-sim-conflict-btn").addEventListener("click", async function () {
          if (state.tasks.length === 0) return;
          const target = state.tasks[0];
          const staleVersion = target.version;
          // Teammate saves an edit first -> bumps version
          await fetch("/api/v1/incidents/" + encodeURIComponent(target.incident_id), {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              expected_version: staleVersion,
              summary: target.summary + " [Actualizado por Valeria]",
              actor: "valeria (otro nodo)",
              gateway_node: "ws-gateway-02",
            }),
          });
          // Now you submit using your stale version -> real 409 OCC guard!
          const staleResp = await fetch("/api/v1/incidents/" + encodeURIComponent(target.incident_id), {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              expected_version: staleVersion,
              summary: "Edición simultánea local",
              actor: "tú (ws-gateway-01)",
              gateway_node: "ws-gateway-01",
            }),
          });
          const staleData = await staleResp.json();
          if (staleResp.status === 409) {
            els.conflictDetail.textContent =
              "Valeria guardó primero la versión v" + staleData.actual_version + " mientras tu copia seguía en v" + staleData.expected_version + ". Ningún cambio se perdió.";
            els.conflictBanner.setAttribute("data-visible", "true");
            showToast("Conflicto de edición detenido con éxito (HTTP 409).");
          }
          await loadAll();
        });

        document.getElementById("pf-reload-latest-btn").addEventListener("click", async function () {
          els.conflictBanner.setAttribute("data-visible", "false");
          await loadAll();
          showToast("Tablero sincronizado con la última versión del equipo.");
        });

        document.getElementById("pf-new-task-btn").addEventListener("click", openNewTaskDrawer);
        document.getElementById("pf-arch-btn").addEventListener("click", function () { loadArchitectureTelemetry(); els.archBackdrop.setAttribute("data-open", "true"); });
        document.getElementById("pf-task-close").addEventListener("click", function () { els.taskBackdrop.setAttribute("data-open", "false"); });
        document.getElementById("pf-new-close").addEventListener("click", function () { els.newBackdrop.setAttribute("data-open", "false"); });
        document.getElementById("pf-arch-close").addEventListener("click", function () { els.archBackdrop.setAttribute("data-open", "false"); });

        window.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            els.taskBackdrop.setAttribute("data-open", "false");
            els.newBackdrop.setAttribute("data-open", "false");
            els.archBackdrop.setAttribute("data-open", "false");
          }
        });

        loadAll();
      })();
    </script>
  </body>
</html>
